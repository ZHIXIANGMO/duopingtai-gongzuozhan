<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>数据 · 橘子头内容工作站</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .line-card{grid-column:1 / -1}
  .dual{display:grid;grid-template-columns:1.55fr .85fr;gap:13px}
  .chart-svg{width:100%;height:auto;display:block;overflow:visible}
  .filters{display:flex;gap:6px;margin-left:auto}
  .fbtn{font-size:10px;padding:4px 10px;border-radius:8px;border:1px solid var(--line2);
    background:#fff;color:#8A8A8A;cursor:pointer;transition:.16s}
  .fbtn:hover{color:var(--ink)}
  .fbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
  @media(max-width:960px){ .dual{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark">🍊</div>
      <div>
        <div class="name">橘子头</div>
        <div class="sub">CONTENT DESK</div>
      </div>
    </div>

    <div class="nav-label">工作站</div>
    <nav class="nav">
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        总览
      </a>
      <a class="nav-item" href="pipeline.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.8"/><rect x="9.5" y="4" width="5" height="11" rx="1.8"/><rect x="16" y="4" width="5" height="7" rx="1.8"/></svg>
        流水线<span class="n" data-count="pipeline">0</span>
      </a>
      <a class="nav-item on" href="data.html">
        <svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3.5-4.5 3 2.5L20 7"/></svg>
        数据<span class="n" data-count="week">0</span>
      </a>
    </nav>

    <div class="side-foot">
      <div class="me">
        <div class="me-top">
          <div class="me-av">🍊</div>
          <div>
            <div class="me-name">橘子头</div>
            <div class="me-role">AI × 个人知识管理</div>
          </div>
        </div>
        <div class="me-stats">
          <div><b id="meWeek">—</b><span>本周已发</span></div>
          <div><b id="meWait">—</b><span>等你</span></div>
          <div><b id="meRead">—</b><span>总阅读</span></div>
        </div>
        <div class="open-note">数据源 · <b>数据/发布记录.csv</b></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumb"><b>数据</b> / 已发布的笔记</div>
      <div class="top-right">
        <div class="sync"><i class="dot loading" id="syncDot"></i><span id="syncText">连接中</span></div>
        <button class="icon-btn" id="btnReload" title="刷新">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.6 5.9"/><path d="M20 5v6h-6"/></svg>
        </button>
        <div class="avatar">🍊</div>
      </div>
    </div>

    <div class="sec-head" style="margin-top:8px">
      <h2 id="pageTitle">本周发布</h2><span id="pageSub">—</span>
    </div>

    <section class="kpis" id="kpis"></section>

    <div class="sec-head">
      <h2>趋势</h2><span>周为单位的发布量与阅读量</span>
    </div>
    <section class="dual">
      <div class="card">
        <div class="card-h"><b>每周阅读量</b><span id="lineTip">近六周</span></div>
        <svg class="chart-svg" id="lineChart" viewBox="0 0 620 214" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="card-foot" id="lineFoot"></div>
      </div>
      <div class="card">
        <div class="card-h"><b>平台对比</b><span>累计</span></div>
        <div class="cbars" id="plat"></div>
        <div class="cstats" id="platStats"></div>
        <div class="card-foot" id="platFoot"></div>
      </div>
    </section>

    <div class="sec-head">
      <h2>值得记一笔的</h2><span>由数据直接算出来，不是感觉</span>
    </div>
    <div class="insight">
      <h3><i></i>这组数字在说什么</h3>
      <ul id="insights"></ul>
    </div>

    <div class="sec-head">
      <h2>单篇明细</h2><span id="rowCount">—</span>
      <div class="filters">
        <button class="fbtn on" data-pf="全部">全部</button>
        <button class="fbtn" data-pf="小红书">小红书</button>
        <button class="fbtn" data-pf="公众号">公众号</button>
      </div>
    </div>
    <div class="card" style="padding:16px 16px 6px">
      <div class="table-wrap">
        <table class="tb">
          <thead><tr>
            <th class="tl">日期</th>
            <th class="tl">标题</th>
            <th class="tl">平台</th>
            <th class="sort" data-key="阅读">阅读</th>
            <th class="sort" data-key="点赞">点赞</th>
            <th class="sort" data-key="收藏">收藏</th>
            <th class="sort" data-key="评论">评论</th>
            <th class="sort on" data-key="互动率">互动率</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="assets/app.js"></script>
<script>
const view = { pf:'全部', key:'互动率', desc:true };

function kpiCard(v, k, d){
  return `<div class="kpi">
    <div class="kv">${v}</div>
    <div class="kk">${k}</div>
    <div class="kd">${d || '&nbsp;'}</div>
  </div>`;
}

function renderKpis(s){
  const w = s['本周'];
  const dRead = delta(w['阅读'], w['上周阅读']);
  const dInter = delta(w['互动'], w['上周互动']);
  const dPub = delta(w['篇数'], w['上周篇数']);

  document.getElementById('pageTitle').textContent = `本周发了 ${w['篇数']} 篇`;
  document.getElementById('pageSub').textContent =
    `${w['标签']} · 第 ${w['第几天']} 天 · 目标 ${w['目标']} 篇`;

  document.getElementById('kpis').innerHTML = [
    kpiCard(`${w['篇数']}<small>/${w['目标']}</small>`, '本周已发布',
      `完成 <b class="${w['完成率'] >= 100 ? 'up' : ''}">${Math.round(w['完成率'])}%</b> · 上周 ${w['上周篇数']} 篇`),
    kpiCard(fmt(w['阅读']), '本周阅读',
      `<span class="${dRead.cls}">${dRead.txt}</span> 比上周`),
    kpiCard(fmt(w['互动']), '本周点赞+收藏+评论',
      `<span class="${dInter.cls}">${dInter.txt}</span> 比上周`),
    kpiCard(fmt(w['涨粉']), '本周涨粉',
      `互动率 <b>${w['阅读'] ? pct(w['互动'] * 100 / w['阅读']) : '—'}</b>`)
  ].join('');
}

function lineChart(weeks){
  const svg = document.getElementById('lineChart');
  // 按容器实际宽度定 viewBox：字不会因为缩放变成 5px
  const W = Math.max(300, Math.round(svg.clientWidth || 620));
  const H = W < 420 ? 176 : 214;
  const L = W < 420 ? 26 : 34, R = W < 420 ? 18 : 26, T = 28, B = 34;
  const fs = W < 420 ? 8.5 : 10;
  const vals = weeks.map(w => w['阅读']);
  const max = Math.max(1, ...vals);
  const step = (W - L - R) / (weeks.length - 1);
  const ih = H - T - B;

  const pts = weeks.map((w, i) => ({
    x: L + i * step,
    y: T + ih - (w['阅读'] / max) * ih,
    v: w['阅读'],
    label: w['本周'] ? '本周' : w['标签'],
    now: w['本周']
  }));

  const path = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length - 1].x.toFixed(1)} ${T + ih} L${pts[0].x.toFixed(1)} ${T + ih} Z`;

  // 三条横向参考线
  const grid = [0, .5, 1].map(f => {
    const y = T + ih - f * ih;
    return `<line x1="${L}" y1="${y}" x2="${W - R}" y2="${y}" stroke="#F4F4F4" stroke-width="1"/>`;
  }).join('');

  const dots = pts.map(p => `
    <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.now ? 5 : 3.6}"
      fill="${p.now ? '#FF5A5F' : '#fff'}" stroke="${p.now ? '#FF5A5F' : '#DCDCDC'}" stroke-width="2"/>
    <text x="${p.x.toFixed(1)}" y="${(p.y - 11).toFixed(1)}" text-anchor="middle" font-size="${fs}"
      font-weight="600" fill="${p.now ? '#FF5A5F' : '#9B9B9B'}" font-family="inherit">${fmtShort(p.v)}</text>
    <text x="${p.x.toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="${fs - .5}"
      fill="${p.now ? '#141414' : '#BEBEBE'}" font-family="inherit">${p.label}</text>`).join('');

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('height', H);

  svg.innerHTML = `
    <defs>
      <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FF5A5F" stop-opacity=".13"/>
        <stop offset="1" stop-color="#FF5A5F" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grid}
    <path d="${area}" fill="url(#areaFill)"/>
    <path d="${path}" fill="none" stroke="#FF5A5F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}`;
}

function fmtShort(n){
  n = Number(n || 0);
  if(n >= 10000) return (n / 10000).toFixed(1) + '万';
  if(n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function renderPlatform(s){
  const list = s['平台'];
  const maxRead = Math.max(1, ...list.map(p => p['阅读']));
  const colors = {'小红书':'#FF5A5F','公众号':'#3FBF7F'};

  document.getElementById('plat').innerHTML = list.map(p => `
    <div class="cbar">
      <div class="ct"><span>${esc(p['平台'])}</span><b>${p['篇数']} 篇 · 阅读 ${fmt(p['阅读'])}</b></div>
      <div class="ctrack"><i style="width:${Math.round(p['阅读'] / maxRead * 100)}%;background:${colors[p['平台']] || '#141414'}"></i></div>
    </div>`).join('');

  const best = list.slice().sort((a, b) => b['互动率'] - a['互动率'])[0];
  document.getElementById('platStats').innerHTML = list.map(p => `
    <div><b>${pct(p['互动率'])}</b><span>${esc(p['平台'])}互动率</span></div>`).join('');

  if(list.length >= 2){
    const hi = best, lo = list.slice().sort((a, b) => a['互动率'] - b['互动率'])[0];
    document.getElementById('platFoot').textContent =
      `${hi['平台']}的互动率是${lo['平台']}的 ${(hi['互动率'] / Math.max(lo['互动率'], .01)).toFixed(1)} 倍：同样的选题先在${hi['平台']}试水，跑得动再改成${lo['平台']}长文。`;
  }
}

function renderRows(s){
  let rows = s['明细'];
  if(view.pf !== '全部') rows = rows.filter(r => r['平台'] === view.pf);
  rows = rows.slice().sort((a, b) => view.desc
    ? b[view.key] - a[view.key]
    : a[view.key] - b[view.key]);

  document.getElementById('rowCount').textContent =
    `${rows.length} 条 · 按${view.key}${view.desc ? '从高到低' : '从低到高'}`;

  const maxRead = Math.max(1, ...rows.map(r => r['阅读']));
  document.getElementById('rows').innerHTML = rows.map(r => `
    <tr>
      <td class="tl"><span class="tb-date">${r['日期'].slice(5)}</span></td>
      <td class="tl"><div class="tb-title">${esc(r['标题'])}</div></td>
      <td class="tl"><span class="pf ${r['平台'] === '小红书' ? 'xhs' : r['平台'] === '公众号' ? 'wx' : 'other'}">${esc(r['平台'])}</span></td>
      <td class="${r['阅读'] === maxRead ? 'tb-hot' : ''}">${fmt(r['阅读'])}</td>
      <td>${fmt(r['点赞'])}</td>
      <td>${fmt(r['收藏'])}</td>
      <td>${fmt(r['评论'])}</td>
      <td>${pct(r['互动率'])}</td>
    </tr>`).join('') || `<tr><td colspan="8"><div class="blank" style="padding:24px 0">这个平台还没有记录</div></td></tr>`;
}

function renderInsights(s){
  const w = s['本周'], best = s['最佳'], tot = s['累计'];
  const ws = s['周趋势'];
  const avg = ws.reduce((a, b) => a + b['篇数'], 0) / ws.length;
  const plats = s['平台'].slice().sort((a, b) => b['互动率'] - a['互动率']);
  const out = [];

  if(best){
    out.push(`跑得最远的是《<b>${esc(best['标题'])}</b>》，${best['平台']}，阅读 ${fmt(best['阅读'])}，互动率 ${pct(best['互动率'])}。`);
  }
  if(plats.length >= 2){
    out.push(`小红书互动率 <b>${pct(plats[0]['互动率'])}</b>，公众号 <b>${pct(plats[1]['互动率'])}</b>。公众号阅读低不代表不行，是渠道分发方式不同，别拿同一把尺量。`);
  }
  out.push(`节奏上，六周平均每周 <b>${avg.toFixed(1)}</b> 篇，这周 <b>${w['篇数']}</b> 篇${w['篇数'] >= avg ? '，高于平均' : '，低于平均'}；离 ${w['目标']} 篇的目标${w['篇数'] >= w['目标'] ? '已达成' : `还差 ${w['目标'] - w['篇数']} 篇`}。`);

  const dRead = delta(w['阅读'], w['上周阅读']);
  if(w['上周阅读']){
    out.push(`本周阅读 ${fmt(w['阅读'])}，比上周${dRead.cls === 'up' ? '多' : dRead.cls === 'down' ? '少' : '持平'} ${dRead.txt.replace('+','').replace('−','')}。篇数${w['篇数'] >= w['上周篇数'] ? '多了' : '少了'}，阅读${dRead.cls === 'down' ? '反而掉了' : '跟着涨'}——${dRead.cls === 'down' ? '说明这几篇的选题弱于上周，不是发得不够' : '说明多发确实有效'}。`);
  }

  out.push(`累计 ${tot['篇数']} 次发布，阅读 ${fmt(tot['阅读'])}，涨粉 ${fmt(tot['涨粉'])}。`);

  document.getElementById('insights').innerHTML = out.map(t => `<li>${t}</li>`).join('');
}

function bindSort(){
  document.querySelectorAll('th.sort').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.key;
      view.desc = (view.key === k) ? !view.desc : true;
      view.key = k;
      document.querySelectorAll('th.sort').forEach(x => x.classList.toggle('on', x === th));
      renderRows(window.__stats);
    });
  });
  document.querySelectorAll('.fbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fbtn').forEach(x => x.classList.toggle('on', x === btn));
      view.pf = btn.dataset.pf;
      renderRows(window.__stats);
    });
  });
}

(async function(){
  const shell = await mountShell();
  if(!shell){
    document.getElementById('pageSub').textContent = '先启动本地服务';
    return;
  }
  const s = shell.stats;
  window.__stats = s;

  renderKpis(s);
  lineChart(s['周趋势']);
  renderPlatform(s);
  renderRows(s);
  renderInsights(s);
  bindSort();

  const total = s['累计']['篇数'];
  document.getElementById('lineTip').textContent = `近六周 · 共 ${total} 条记录`;
  const last = s['周趋势'][s['周趋势'].length - 1], prev = s['周趋势'][s['周趋势'].length - 2];
  const dv = delta(last['阅读'], prev['阅读']);
  document.getElementById('lineFoot').textContent =
    `本周阅读 ${fmt(last['阅读'])}，${dv.txt === '持平' ? '与上周持平' : '比上周' + dv.txt}。周发布量在 ${Math.min(...s['周趋势'].map(x => x['篇数']))}–${Math.max(...s['周趋势'].map(x => x['篇数']))} 篇之间。`;

  document.getElementById('btnReload').addEventListener('click', () => location.reload());

  let rzTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(() => lineChart(window.__stats['周趋势']), 160);
  });
})();
</script>
</body>
</html>
