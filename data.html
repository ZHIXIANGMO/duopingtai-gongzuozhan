<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据 · 内容矩阵</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
  .wk-bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:120px}
  .wk-col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .wk-bar{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:#EAEAEA;transition:height .4s;min-height:3px}
  .wk-bar.now{background:var(--accent)}
  .wk-n{font-size:10px;font-weight:600;color:#8A8A8A;font-variant-numeric:tabular-nums}
  .wk-n.now{color:var(--accent)}
  .wk-lb{font-size:9px;color:#BEBEBE;white-space:nowrap}
  .form-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  @media(max-width:1180px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
  @media(max-width:820px){.form-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>

  <main class="main">
    <div class="topbar">
      <div class="crumb">数据 · <b id="weekLabel"></b></div>
      <div class="top-right">
        <div class="sync"><span id="syncDot" class="dot"></span><span id="syncText"></span></div>
        <button class="icon-btn" id="reload" title="重新读">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6"/></svg>
        </button>
      </div>
    </div>

    <div id="top"></div>

    <div class="kpis" id="kpis"></div>

    <div id="empty"></div>

    <div class="grid2" id="rowA" style="margin-top:20px"></div>
    <div class="grid2" id="rowB" style="margin-top:12px"></div>

    <div class="sec-head"><h2>投放明细</h2><span id="mineCount"></span></div>
    <div class="card" style="padding:15px 10px 10px">
      <div class="table-wrap"><table class="tb" id="table"></table></div>
    </div>

    <div class="sec-head"><h2>手动补一条</h2><span>书签脚本还没做，先手填</span></div>
    <div class="card">
      <div class="form-row">
        <div class="field"><label>账号</label><select id="fAcc"></select></div>
        <div class="field"><label>发布日</label><input id="fDay" type="date"></div>
        <div class="field" style="grid-column:span 2"><label>稿件</label><select id="fDraft"></select></div>
        <div class="field" style="grid-column:span 2"><label>标题</label><input id="fTitle" placeholder="这篇叫什么"></div>
        <div class="field"><label>阅读</label><input id="fRead" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label>点赞</label><input id="fLike" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label>收藏</label><input id="fFav" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label>评论</label><input id="fCmt" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label>涨粉</label><input id="fGrow" inputmode="numeric" placeholder="0"></div>
        <div class="field" style="grid-column:span 2"><label>推广动作（可选）</label><input id="fPromo" placeholder="比如：薯条 100 元"></div>
      </div>
      <button class="btn btn-primary" id="addBtn" style="margin-top:4px">写进去</button>
      <span class="pane-sub" style="display:inline-block;margin-left:10px;font-size:10px;color:#B5B5B5">
        同一天同一账号同一标题会覆盖，不会重复
      </span>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
<script>
let STATE = null;

/* 从左下角名片点某个号进来时，只显示这个号的记录 */
const ACC_FILTER = new URLSearchParams(location.search).get('acc')
  || new URLSearchParams(location.search).get('账号') || '';

function kpi(v, k, d){
  return `<div class="kpi"><div class="kv num">${v}</div><div class="kk">${k}</div>
    ${d ? `<div class="kd">${d}</div>` : ''}</div>`;
}

function renderTop(){
  const S = STATE['统计'] || {};
  const wk = S['本周'] || {};
  $('#weekLabel').textContent = (wk['标签'] || '') + ' · 第 ' + (wk['第几天'] || 0) + ' 天';

  const up = (a, b) => {
    if(!b) return a ? '<span class="up">新增</span>' : '—';
    const r = Math.round((a - b) * 1000 / b) / 10;
    return r > 0 ? `<span class="up">+${r}%</span>` : (r < 0 ? r + '%' : '持平');
  };

  $('#kpis').innerHTML =
    kpi(wk['篇数'] || 0, '本周发布', '目标 ' + (wk['目标'] || 0) + ' · 上周 ' + (wk['上周篇数'] || 0)) +
    kpi(fmt(wk['阅读'] || 0), '本周阅读', up(wk['阅读'] || 0, wk['上周阅读'] || 0)) +
    kpi(fmt(wk['互动'] || 0), '本周互动', up(wk['互动'] || 0, wk['上周互动'] || 0)) +
    kpi(fmt(wk['涨粉'] || 0), '本周涨粉', '累计 ' + fmt((S['累计'] || {})['涨粉'] || 0));

  if(!S['有数据']){
    $('#empty').innerHTML = `<div class="banner" style="margin-top:14px">
      <b>还没有真实数据。</b> 这一页不编数字，所以现在是空的。<br>
      发出去一篇之后，在下面「手动补一条」填进去，或者等书签脚本做好，点一下就能抓。
    </div>`;
  }else{
    $('#empty').innerHTML = '';
  }
}

function renderAccounts(){
  const S = STATE['统计'] || {};
  const accs = S['按账号'] || [];
  const plats = S['按平台'] || [];
  const maxRead = Math.max(1, ...accs.map(a => a['阅读']));

  $('#rowA').innerHTML = `
    <div class="card">
      <div class="card-h"><b>按账号</b><span>${accs.length} 个有数据</span></div>
      ${accs.length ? `<div class="bars">${accs.map(a => `
        <div class="bar">
          <div class="bt">${esc(a['账号名'])} ${platTag(a['平台'])}
            <b>${fmt(a['阅读'])}</b></div>
          <div class="track"><i class="${a['阅读'] === maxRead ? 'hot' : ''}"
            style="width:${Math.max(3, a['阅读'] * 100 / maxRead)}%"></i></div>
          <div style="font-size:9.5px;color:#B5B5B5">${a['篇数']} 篇 · 互动率 ${pct(a['互动率'])} · 涨粉 ${fmt(a['涨粉'])}</div>
        </div>`).join('')}</div>` : '<div class="blank" style="padding:20px">没有投放记录</div>'}
    </div>
    <div class="card">
      <div class="card-h"><b>按平台</b><span>哪边值得多花时间</span></div>
      ${plats.length ? `<div class="bars">${plats.map(p => `
        <div class="bar">
          <div class="bt">${esc(p['平台'])}<b>${fmt(p['阅读'])}</b></div>
          <div class="track"><i style="width:${Math.max(3, p['阅读'] * 100 / Math.max(1, ...plats.map(x => x['阅读'])))}%"></i></div>
          <div style="font-size:9.5px;color:#B5B5B5">${p['篇数']} 篇 · 互动率 ${pct(p['互动率'])}</div>
        </div>`).join('')}</div>` : '<div class="blank" style="padding:20px">没有投放记录</div>'}
    </div>`;
}

function renderWeeks(){
  const S = STATE['统计'] || {};
  const weeks = S['周趋势'] || [];
  const max = Math.max(1, ...weeks.map(w => w['篇数']));
  const best = S['最佳'];

  $('#rowB').innerHTML = `
    <div class="card">
      <div class="card-h"><b>近六周</b><span>按发布篇数</span></div>
      <div class="wk-bars">
        ${weeks.map(w => `
          <div class="wk-col">
            <div class="wk-n ${w['本周'] ? 'now' : ''}">${w['篇数']}</div>
            <div class="wk-bar ${w['本周'] ? 'now' : ''}" style="height:${Math.max(3, w['篇数'] * 100 / max)}%"></div>
            <div class="wk-lb">${esc(w['标签'])}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><b>值得记一笔的</b><span>脚本算的，你改不了</span></div>
      ${best ? `<div class="insight">
        <h3><i></i>阅读最高的一篇</h3>
        <ul>
          <li><b>${esc(best['标题'])}</b><br>${esc(best['平台'])} · ${fmt(best['阅读'])} 阅读 · 互动率 ${pct(best['互动率'])}</li>
          <li>发布在 ${esc(best['发布日'])}</li>
        </ul>
      </div>` : `<div class="blank" style="padding:20px">还没数据，算不出来</div>`}
    </div>`;
}

function renderTable(){
  const all = STATE['投放'] || [];
  const focus = ACC_FILTER ? (STATE['账号'] || []).find(a => a.id === ACC_FILTER) : null;
  const rows = focus ? all.filter(r => r['账号'] === focus.id) : all;

  $('#mineCount').innerHTML = focus
    ? `只看 <b>${esc(focus['账号名'])}</b> · ${rows.length} 条 <a href="data.html" style="color:#B5B5B5;margin-left:6px">显示全部</a>`
    : (rows.length ? rows.length + ' 条' : '');

  if(!rows.length){
    $('#table').innerHTML = `<tbody><tr><td style="text-align:center;color:#B5B5B5;padding:26px">
      ${focus ? esc(focus['账号名']) + ' 还没有投放记录' : '还没有投放记录'}
    </td></tr></tbody>`;
    return;
  }

  $('#table').innerHTML = `
    <thead><tr>
      <th class="tl">标题</th><th class="tl">账号</th><th>发布日</th>
      <th>阅读</th><th>点赞</th><th>收藏</th><th>评论</th><th>互动率</th><th>涨粉</th>
    </tr></thead>
    <tbody>
      ${rows.map(r => `<tr>
        <td class="tl"><div class="tb-title">${esc(r['标题'])}</div></td>
        <td class="tl">${esc(r['账号名'])} ${platTag(r['平台'])}</td>
        <td><span class="tb-date">${esc(r['发布日'])}</span></td>
        <td class="${r['阅读'] ? 'tb-hot' : ''}">${fmt(r['阅读'])}</td>
        <td>${fmt(r['点赞'])}</td>
        <td>${fmt(r['收藏'])}</td>
        <td>${fmt(r['评论'])}</td>
        <td>${pct(r['互动率'])}</td>
        <td>${fmt(r['涨粉'])}</td>
      </tr>`).join('')}
    </tbody>`;
}

function renderForm(){
  const accs = STATE['账号'] || [];
  $('#fAcc').innerHTML = accs.map(a =>
    `<option value="${esc(a.id)}">${esc(a['账号名'])} · ${esc(a['平台'])}</option>`).join('');

  // 投放要挂回稿件，不然「这篇稿表现怎么样」永远查不出来
  const drafts = (STATE['稿件'] || []).slice().reverse();
  $('#fDraft').innerHTML = '<option value="">不挂稿件</option>' + drafts.map(d =>
    `<option value="${esc(d.id)}">${esc(d.id)} · ${esc((d['选题标题'] || '').slice(0, 22))}</option>`).join('');

  $('#fDraft').onchange = () => {
    const d = drafts.find(x => x.id === $('#fDraft').value);
    if(d && !$('#fTitle').value.trim()){
      $('#fTitle').value = d['选题标题'] || d.id;
    }
  };

  if(!$('#fDay').value){
    $('#fDay').value = ymd(new Date());
  }
}

async function addRow(){
  const btn = $('#addBtn');
  const title = $('#fTitle').value.trim();
  if(!title){ toast('先写个标题'); return; }

  btn.disabled = true;
  try{
    await postJSON('/api/pub', {
      '账号': $('#fAcc').value,
      '发布日': $('#fDay').value,
      '稿件': $('#fDraft').value,
      '标题': title,
      '阅读': $('#fRead').value,
      '点赞': $('#fLike').value,
      '收藏': $('#fFav').value,
      '评论': $('#fCmt').value,
      '涨粉': $('#fGrow').value,
      '推广动作': $('#fPromo').value
    });
    ['#fTitle', '#fRead', '#fLike', '#fFav', '#fCmt', '#fGrow', '#fPromo'].forEach(s => $(s).value = '');
    await reload();
    toast('写进去了');
  }catch(e){
    toast('没写进去：' + e.message);
  }finally{
    btn.disabled = false;
  }
}

async function reload(){
  STATE = await getJSON(withIdent('/api/state'));
  renderSide(STATE, 'data');
  renderTop();
  renderAccounts();
  renderWeeks();
  renderTable();
  renderForm();
  setSync('ok', '已连接 · ' + (STATE['服务时间'] || ''));
}

(async function init(){
  STATE = await boot('data');
  if(!STATE){ offlineBlock($('#top')); return; }
  renderTop();
  renderAccounts();
  renderWeeks();
  renderTable();
  renderForm();
  $('#addBtn').addEventListener('click', addRow);
  $('#reload').addEventListener('click', reload);
})();
</script>
</body>
</html>
