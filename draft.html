<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写稿 · IP 写作工作台</title><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/draft.css"></head>
<body class="writer-page"><div class="app"><aside class="side" id="side"></aside><main class="main writer">
<header class="writer-head"><div><a href="topics.html">← 选题库</a><h1 id="title">正在读取文章</h1><a id="ipLink" href="persona.html">IP 人设</a></div><span id="status" role="status" aria-live="polite"></span></header>
<nav class="writer-mobile" aria-label="写作区域"><button data-pane="body" aria-pressed="true">正文</button><button data-pane="chat" aria-pressed="false">讨论</button></nav>
<div class="writer-grid" data-pane="body"><section class="manuscript" aria-label="文章正文"><div class="writer-actions"><button class="btn" id="save">保存正文</button><button class="btn" id="preview">预览</button><button class="btn" id="confirmBody">正文满意，确认</button><button class="btn" id="reloadDraft">重新载入</button></div>
<textarea id="bodyEditor" aria-label="当前正文" placeholder="在这里直接写，或在右侧和 AI 从想法开始聊。"></textarea><article id="bodyPreview" class="doc" hidden></article>
<details class="materials"><summary>素材与附件</summary><label for="materialEditor">素材、经历或参考原文</label><textarea id="materialEditor" rows="5"></textarea><button class="btn" id="saveMaterials">保存素材</button><label class="attachment">添加附件<input type="file" id="assetInput" accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,.md,.docx,.csv,.html"></label><div id="assets"></div><p>链接和附件供你查阅。需要 AI 参考的内容，请粘贴原文到素材中。</p></details></section>
<section class="conversation" aria-label="写作讨论"><div class="writer-actions"><h2>一起写这篇</h2><button class="btn" id="generate">拟一版正文</button><a href="settings.html">模型设置</a></div>
<details id="archives"><summary>历史对话</summary><div id="archiveList"></div><div id="archiveContent"></div></details><div id="messages" aria-live="polite"></div><div id="chatStatus" role="status"></div><button class="btn" id="retryChat" hidden>重试保存对话</button>
<form id="chatForm"><label for="messageInput">说说你的想法，或指出哪里不像你</label><textarea id="messageInput" rows="3" required></textarea><button class="btn btn-primary" id="send">发送</button></form></section></div></main></div><div class="toast" id="toast"></div><script src="assets/app.js"></script><script src="assets/draft.js"></script></body></html>
