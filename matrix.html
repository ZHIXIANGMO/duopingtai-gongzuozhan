<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>矩阵 · 内容矩阵</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .row-plat{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:stretch;
    padding:14px 0;border-bottom:1px solid var(--line)}
  .row-plat:last-child{border-bottom:0}
  .row-lab{padding-top:2px}
  .row-lab b{font-size:12px;font-weight:600}
  .row-lab span{display:block;font-size:9.5px;color:#B5B5B5;margin-top:4px;line-height:1.6}
  .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .who-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
  .who-av{width:42px;height:42px;border-radius:14px;flex:none;
    background:linear-gradient(135deg,#FFC2A6,#FF5A5F);display:grid;place-items:center;
    color:#fff;font-size:17px;font-weight:600}
  .who-t{font-size:15px;font-weight:600}
  .who-s{font-size:10.5px;color:var(--mute);margin-top:3px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>

  <main class="main">
    <div class="topbar">
      <div class="crumb">矩阵 · <b id="topCount"></b></div>
      <div class="top-right">
        <div class="sync"><span id="syncDot" class="dot"></span><span id="syncText"></span></div>
      </div>
    </div>

    <div id="who"></div>
    <div id="grid"></div>

    <div class="sec-head"><h2>怎么读这张表</h2></div>
    <div class="card">
      <div class="who-s" style="line-height:1.9;color:#7C7C7C">
        这里只显示<b id="whoName"></b>名下的号，别的 IP 不会混进来。想换一个 IP 看，点左下角那摞卡片。<br>
        一行是一个平台。同一个平台可以开多个号，比如一个主号一个测试号，互不影响。<br>
        点任意一个号，进数据页只看它。每行末尾的"＋"点一下就能给你开个新号。
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
<script>
let STATE = null;

const PLATFORMS = ['小红书', '公众号', '抖音', 'B站'];

function renderWho(){
  const ident = STATE['当前身份'] || {};
  const name = ident['名称'] || '未命名';
  const pos = ident['定位'] || '';
  const reader = ident['读者'] || '';

  $('#who').innerHTML = `
    <div class="who-head">
      <div class="who-av">${esc(name.slice(0, 1))}</div>
      <div>
        <div class="who-t">${esc(name)}</div>
        <div class="who-s">${esc(pos)}${pos && reader ? ' · ' : ''}${esc(reader)}</div>
      </div>
    </div>`;

  const wn = $('#whoName');
  if(wn) wn.textContent = name;
}

function renderGrid(){
  const who = STATE['当前身份'] || {};
  const accs = STATE['账号'] || [];        // 服务端已按当前身份收窄，这里不再过滤
  const stats = (STATE['统计'] || {})['按账号'] || [];
  const byKey = {};
  stats.forEach(s => byKey[s['账号']] = s);

  // 默认四个平台打底，剩下的按这个身份实际开过的补上，不写死
  const plats = PLATFORMS.slice();
  accs.forEach(a => {
    const p = a['平台'];
    if(p && plats.indexOf(p) < 0) plats.push(p);
  });

  const html = plats.map(p => {
    const cells = accs.filter(a => a['平台'] === p);

    const cards = cells.map(a => {
      const s = byKey[a.id] || {};
      return `<a class="mx-cell" href="data.html?acc=${encodeURIComponent(a.id)}">
        <div class="mx-name">${esc(a['账号名'] || a.id)}</div>
        <div class="mx-sub">粉丝基线 ${fmt(a['粉丝基线'] || 0)} · ${esc(a['状态'] || '正常')}</div>
        <div class="mx-nums">
          <div><b class="num">${s['篇数'] || 0}</b><span>已投</span></div>
          <div><b class="num">${fmt(s['阅读'] || 0)}</b><span>阅读</span></div>
          <div><b class="num">${fmt(s['涨粉'] || 0)}</b><span>涨粉</span></div>
        </div>
      </a>`;
    }).join('');

    return `<div class="row-plat">
      <div class="row-lab">
        <b>${esc(p)}</b>
        <span>${cells.length ? cells.length + ' 个号' : '未开'}</span>
      </div>
      <div class="cells">
        ${cards}
        <div class="mx-cell add" data-add="${esc(p)}">
          <div class="mx-plus">＋</div>
          <div class="mx-sub">${cells.length ? '再开一个号' : '开第一个号'}</div>
          <div class="mx-sub" style="margin-top:3px;color:#B8B8B8">点一下就能建</div>
        </div>
      </div>
    </div>`;
  }).join('');

  $('#grid').innerHTML = html;
  $('#topCount').textContent = (who['名称'] || '未命名') + ' · ' + accs.length + ' 个号';

  // 「＋」现在真能建号：点开在该行末尾长一个输入框，回车写入 数据/账号/
  $('#grid').querySelectorAll('[data-add]').forEach(el => {
    el.addEventListener('click', () => {
      const plat = el.dataset.add;
      const row = el.closest('.row-plat');
      const box = row.querySelector('.cells');
      // 输入框排在 ＋ 前面，保证「＋」一直在最后
      const holder = document.createElement('div');
      holder.style.cssText = 'display:flex;align-items:center;gap:6px;flex:none';
      box.insertBefore(holder, el);
      inlineNew(holder, {
        placeholder: plat + ' 账号名…',
        onSubmit: async v => {
          await postJSON('/api/new', {kind: '账号', '平台': plat, '账号名': v});
          holder.remove();
          STATE = await getJSON(withIdent('/api/state'));
          renderWho();
          renderGrid();
          toast('号建好了，去数据页补基线');
        }
      });
    });
  });
}

(async function init(){
  STATE = await boot('matrix');
  if(!STATE){ offlineBlock($('#grid')); return; }
  renderWho();
  renderGrid();
})();
</script>
</body>
</html>
