<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今天 · 内容矩阵</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>

  <main class="main home">
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="top-right">
        <div class="sync"><span id="syncDot" class="dot"></span><span id="syncText"></span></div>
      </div>
    </div>
    <div id="body"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
<script>
let STATE = null;
let PICKDAY = '';   // 日历上点开的那一天

/* ---------- 小工具 ---------- */
function todayStr(){
  return ((STATE['统计'] || {})['今天']) || ymd(new Date());
}

function parseDay(s){
  const p = String(s || '').split('-').map(Number);
  return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
}

function dayLabel(s){
  const d = parseDay(s);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + '日一二三四五六'[d.getDay()];
}

function shiftDay(d, n){
  const x = new Date(d.getTime());
  x.setDate(x.getDate() + n);
  return x;
}

/* ---------- 顶部 ---------- */
function renderTop(){
  const stats = STATE['统计'] || {};
  const week = stats['本周'] || {};
  const todos = STATE['待办'] || [];
  const drafts = STATE['稿件'] || [];
  const who = (STATE['当前身份'] || {})['名称'] || '';

  $('#crumb').innerHTML = `<b>${esc(dayLabel(todayStr()))}</b> · ${esc(who)}`;

  const red = todos.filter(t => t['级别'] === 'red').length;
  const bits = [];
  if(red) bits.push(`<b>${red}</b> 件卡住了`);
  if(drafts.length) bits.push(`<b>${drafts.length}</b> 篇在手上`);
  if(!red && !drafts.length) bits.push('今天没有非做不可的事');

  return `<div class="hello">
    <div class="hello-h">${esc(greeting())}</div>
    <div class="hello-s">${bits.join('，')}。${esc(week['标签'] ? '本周已发 ' + (week['篇数'] || 0) + '/' + (week['目标'] || 0) : '')}</div>
  </div>`;
}

function greeting(){
  const h = new Date().getHours();
  if(h < 6) return '还没睡';
  if(h < 11) return '早上好';
  if(h < 14) return '中午好';
  if(h < 18) return '下午好';
  if(h < 23) return '晚上好';
  return '快睡吧';
}

/* ---------- KPI ---------- */
function kpis(){
  const stats = STATE['统计'] || {};
  const week = stats['本周'] || {};
  const total = stats['累计'] || {};
  const drafts = STATE['稿件'] || [];
  const todos = STATE['待办'] || [];

  const card = (v, k, d) => `<div class="kpi">
    <div class="kv">${v}</div><div class="kk">${k}</div><div class="kd">${d || ''}</div></div>`;

  return `<div class="kpis">
    ${card(`${week['篇数'] || 0}<small>/${week['目标'] || 0}</small>`, '本周发布', `还剩 ${week['剩几天'] || 0} 天`)}
    ${card(fmt(total['阅读'] || 0), '累计阅读', `互动 ${fmt(total['互动'] || 0)}`)}
    ${card(drafts.length, '在手稿件', drafts.length ? '最远到 ' + esc(furthest(drafts)) : '一条都没有')}
    ${card(todos.length, '等你处理', todos.length ? '不处理就卡着' : '干净')}
  </div>`;
}

function furthest(drafts){
  let best = '讨论';
  drafts.forEach(d => {
    if(STAGES.indexOf(d['阶段']) > STAGES.indexOf(best)) best = d['阶段'];
  });
  return STAGE_LABEL[best] || best;
}

/* ---------- 账号与数据 ---------- */
function accountsCard(){
  const stats = STATE['统计'] || {};
  const byAcc = stats['按账号'] || [];
  const accs = STATE['账号'] || [];

  if(!accs.length){
    return card('账号与数据', '<div class="blank">还没有账号。先在 matrix.html 里开一个号。</div>');
  }

  const rows = accs.map(a => {
    const d = byAcc.find(x => x['账号'] === a.id) || {};
    const pubs = d['篇数'] || 0;
    const read = d['阅读'] || 0;
    return `<a class="hrow" href="data.html?acc=${encodeURIComponent(a.id)}">
      <span class="hrow-l">
        ${platTag(a['平台'])}
        <b>${esc(a['账号名'] || a.id)}</b>
      </span>
      <span class="hrow-n num">${pubs}<i>篇</i></span>
      <span class="hrow-n num">${read ? fmt(read) : '—'}<i>阅读</i></span>
      <span class="hrow-n num">${read ? pct(d['互动率']) : '—'}<i>互动</i></span>
    </a>`;
  }).join('');

  const note = byAcc.length ? '' :
    '<div class="hnote">还没有投放数据。发一篇之后在数据页填一行，这儿就活了。</div>';

  return card('账号与数据', `
    <div class="hrow h">
      <span class="hrow-l">账号</span>
      <span class="hrow-n">发布</span><span class="hrow-n">阅读</span><span class="hrow-n">互动率</span>
    </div>${rows}${note}`, '按账号看，点一行进数据页');
}

/* ---------- 选题进度 ---------- */
function topicsCard(){
  const topics = (STATE['选题'] || []).filter(t => t['状态'] !== '已用' && t['状态'] !== '废弃');
  const drafts = STATE['稿件'] || [];

  if(!topics.length){
    return card('选题进度', '<div class="blank">选题库是空的。</div>');
  }

  const rows = topics.map(t => {
    const mine = drafts.filter(d => d['选题'] === t.id);
    const title = (t['标题候选'] || '').split('|')[0].trim() || t.id;
    const miss = t['缺冲突'] || [];

    if(!mine.length){
      return `<div class="hrow topic" data-topic="${esc(t.id)}">
        <span class="hrow-l"><b>${esc(title)}</b>
          <em class="hsub">${miss.length ? '缺 ' + esc(miss.join('/')) : '冲突齐了'} · 还没开稿</em></span>
        <span class="hrow-tag chip ${miss.length ? 'wait' : 'ok'}">${miss.length ? '待补' : '可开稿'}</span>
      </div>`;
    }

    const d = mine[0];
    return `<div class="hrow topic" data-draft="${esc(d.id)}">
      <span class="hrow-l"><b>${esc(title)}</b>
        <em class="hsub">${esc(d.id)} · ${esc(d['阶段名'] || d['阶段'])} · ${d['字数'] || 0} 字</em></span>
      <span class="hrow-bar">${stageBar(d, {cls:'sm', label:false})}</span>
      <span class="hrow-tag chip">${esc(d['阶段'])} ${d['阶段序号']}/${d['阶段总数'] || STAGES.length}</span>
    </div>`;
  }).join('');

  return card('选题进度', rows, `${topics.length} 条在库 · 点开进对应窗口`);
}

/* ---------- 待办 ---------- */
function todosCard(){
  const todos = STATE['待办'] || [];
  if(!todos.length){
    return card('等你处理', '<div class="blank small">没有卡着的事。<br>可以去记一条灵感。</div>');
  }

  const rows = todos.map(t => {
    const g = t['目标'] || {};
    const href = g.kind === '稿件' ? 'draft.html?id=' + encodeURIComponent(g.id)
      : g.kind === '选题' ? 'topics.html?id=' + encodeURIComponent(g.id)
      : g.kind === '灵感' ? 'index.html'
      : 'data.html';
    return `<a class="td ${t['级别'] === 'red' ? 'red' : ''}" href="${href}">
      <div class="td-t">${esc(t['类型'])}</div>
      <div class="td-h">${esc(t['标题'])}</div>
      <div class="td-n">${esc(t['说明'] || '')}</div>
    </a>`;
  }).join('');

  return card('等你处理', `<div class="tdwrap">${rows}</div>`, todos.length + ' 件');
}

/* ---------- 日历 ---------- */
function calendarCard(){
  const logs = STATE['日志'] || [];
  const byDay = {};
  logs.forEach(l => {
    const k = l['日期'];
    (byDay[k] = byDay[k] || []).push(l);
  });

  const today = parseDay(todayStr());
  const dow = (today.getDay() + 6) % 7;              // 周一 = 0
  const lastMonday = shiftDay(today, -dow);
  const WEEKS = 10;
  const firstMonday = shiftDay(lastMonday, -7 * (WEEKS - 1));

  const level = n => n === 0 ? 0 : n === 1 ? 1 : n <= 3 ? 2 : 3;

  let cols = '';
  for(let w = 0; w < WEEKS; w++){
    let cells = '';
    for(let i = 0; i < 7; i++){
      const d = shiftDay(firstMonday, w * 7 + i);
      if(d > today){ cells += '<i class="hm pad"></i>'; continue; }
      const key = ymd(d);
      const n = (byDay[key] || []).length;
      const cls = ['hm', 'l' + level(n)];
      if(key === todayStr()) cls.push('today');
      if(key === PICKDAY) cls.push('sel');
      const tip = key + ' · ' + n + ' 件';
      cells += `<i class="${cls.join(' ')}" data-day="${key}" title="${esc(tip)}"></i>`;
    }
    cols += `<div class="hcol7">${cells}</div>`;
  }

  const day = PICKDAY || todayStr();
  const list = (byDay[day] || []).slice().sort((a, b) => b['时间'].localeCompare(a['时间']));
  const listHtml = list.length ? list.map(l => `
    <div class="lg">
      <span class="lg-t num">${esc((l['时间'] || '').slice(11))}</span>
      <span class="lg-a">${esc(l['动作'])}<em>${esc(l['备注'] || '')}</em></span>
      <span class="lg-o">${esc(l['对象'] || '')}</span>
    </div>`).join('') :
    `<div class="blank small">${day === todayStr() ? '今天还没记下什么。' : '这天没有记录。'}</div>`;

  return card(`日历 · ${esc(dayLabel(day))}`, `
    <div class="hmon">${cols}</div>
    <div class="hlegend">
      <span>近 ${WEEKS} 周</span>
      <i class="hm l0"></i><i class="hm l1"></i><i class="hm l2"></i><i class="hm l3"></i>
    </div>
    <div class="hlogs">${listHtml}</div>`, '深浅 = 那天做了几件事');
}

/* ---------- 卡片壳 ---------- */
function card(title, inner, note){
  return `<section class="hcard">
    <div class="hcard-h">
      <b>${title}</b>
      ${note ? `<span>${esc(note)}</span>` : ''}
    </div>
    ${inner}
  </section>`;
}

/* ---------- 渲染 ---------- */
function render(){
  $('#body').innerHTML = renderTop() + kpis() +
    `<div class="hcols">
      <div class="hcol wide">${accountsCard()}${topicsCard()}</div>
      <div class="hcol narrow">${todosCard()}${calendarCard()}</div>
    </div>`;
  bind();
}

function bind(){
  document.querySelectorAll('.hm[data-day]').forEach(el => {
    el.addEventListener('click', () => {
      PICKDAY = el.dataset.day;
      render();
    });
  });

  document.querySelectorAll('.hrow[data-draft]').forEach(el => {
    el.addEventListener('click', () => {
      location.href = 'draft.html?id=' + encodeURIComponent(el.dataset.draft);
    });
  });

  document.querySelectorAll('.hrow[data-topic]').forEach(el => {
    el.addEventListener('click', () => {
      location.href = 'topics.html?id=' + encodeURIComponent(el.dataset.topic);
    });
  });
}

/* ---------- 启动 ---------- */
(async function init(){
  STATE = await boot('work');
  if(!STATE){
    offlineBlock($('#body'));
    return;
  }
  PICKDAY = todayStr();
  render();
})();
</script>
</body>
</html>
