<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 内容矩阵</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>

  <main class="main work">
    <div class="queue">
      <div class="q-head"><b>等你处理</b><span id="qCount"></span></div>
      <div class="q-sub">不处理就卡住的事。点一条，右边接着说。</div>
      <div id="qList"></div>
    </div>

    <section class="chat">
      <div class="chat-head">
        <div class="ch-l">
          <div class="ch-t" id="chTitle">还没选东西</div>
          <div class="ch-s" id="chSub">从左边挑一条，或直接在下面说你要干什么</div>
        </div>
        <div class="top-right">
          <div class="sync"><span id="syncDot" class="dot"></span><span id="syncText"></span></div>
        </div>
      </div>

      <div class="msgs" id="msgs"></div>

      <div class="composer">
        <div id="aiBanner"></div>
        <div class="cbox">
          <textarea id="input" rows="1" placeholder="说你想干什么…"></textarea>
          <div class="crow">
            <span class="hint" id="hint">Enter 发送 · Shift + Enter 换行</span>
            <button class="send" id="send" title="发送">
              <svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
<script>
let STATE = null;
let CUR = { kind:'', id:'', title:'', sub:'' };
let HISTORY = [];
let SENDING = false;

const $msgs = () => $('#msgs');

function keyOf(){ return 'chat:' + CUR.kind + ':' + CUR.id; }

function loadHistory(){
  try{
    const raw = localStorage.getItem(keyOf());
    HISTORY = raw ? JSON.parse(raw) : [];
  }catch(e){ HISTORY = []; }
  if(!HISTORY.length && CUR.kind){
    HISTORY = [{ role:'assistant', content: opener(), _sys:true }];
  }
}

function saveHistory(){
  try{ localStorage.setItem(keyOf(), JSON.stringify(HISTORY.slice(-40))); }catch(e){}
}

function opener(){
  if(CUR.kind === '选题'){
    return '这条选题开着。' + (CUR.sub || '') + '\n\n先说说你现在的想法，或者让我看看冲突哪里最虚。';
  }
  if(CUR.kind === '稿件'){
    return '稿子在这儿。' + (CUR.sub || '') + '\n\n想改哪段直接说，想整篇重写就说方向。';
  }
  if(CUR.kind === '灵感'){
    return '这条灵感还只是个句子。' + (CUR.sub || '') + '\n\n要不要试试把它变成一个选题？';
  }
  return '说吧，你现在想干什么？';
}

/* ---------- 队列 ---------- */
function renderQueue(){
  const host = $('#qList');
  if(!STATE){ host.innerHTML = '<div class="q-empty">读不到数据</div>'; return; }

  const todos = STATE['待办'] || [];
  const topics = STATE['选题'] || [];
  const drafts = STATE['稿件'] || [];
  const sparks = STATE['灵感'] || [];

  $('#qCount').textContent = todos.length ? todos.length + ' 件' : '';

  const qitem = (o) => `
    <div class="q-item ${CUR.kind === o.kind && CUR.id === o.id ? 'on' : ''} ${o.red ? 'red' : ''}"
         data-kind="${o.kind}" data-id="${esc(o.id)}">
      <div class="q-body">
        <div class="q-type"><i class="${o.red ? '' : 'gray'}"></i>${esc(o.type)}</div>
        <div class="q-title">${esc(o.title)}</div>
        ${o.note ? `<div class="q-note">${esc(o.note)}</div>` : ''}
      </div>
    </div>`;

  let html = '';

  if(todos.length){
    html += `<div class="q-group"><div class="q-lab">该你出手</div>`;
    html += todos.map(t => qitem({
      kind: t['目标'].kind,
      id: t['目标'].id,
      type: t['类型'],
      title: t['标题'],
      note: t['说明'],
      red: t['级别'] === 'red'
    })).join('');
    html += `</div>`;
  }

  const waiting = topics.filter(t => t['状态'] === '待定');
  if(waiting.length){
    html += `<div class="q-group"><div class="q-lab">选题 ${waiting.length}</div>`;
    html += waiting.map(t => qitem({
      kind:'选题', id:t.id, type:'选题',
      title:(t['标题候选']||'').split('|')[0].trim() || t.id,
      note: (t['缺冲突'] && t['缺冲突'].length)
        ? '缺：' + t['缺冲突'].join(' / ')
        : '冲突齐了，可以往下走'
    })).join('');
    html += `</div>`;
  }

  const live = drafts.filter(d => d['状态'] !== '定稿');
  if(live.length){
    html += `<div class="q-group"><div class="q-lab">稿件 ${live.length}</div>`;
    html += live.map(d => qitem({
      kind:'稿件', id:d.id, type:'稿件 · ' + (d['状态']||''),
      title: d['选题标题'] || d.id,
      note: (d['字数']||0) + ' 字 · ' + (d['版本']||'v1')
    })).join('');
    html += `</div>`;
  }

  const young = sparks.filter(s => s['状态'] === '未孵化');
  if(young.length){
    html += `<div class="q-group"><div class="q-lab">灵感 ${young.length}</div>`;
    html += young.map(s => qitem({
      kind:'灵感', id:s.id, type:'灵感 · ' + (s['来源']||''),
      title: s['原话'] || s.id
    })).join('');
    html += `</div>`;
  }

  host.innerHTML = html ||
    '<div class="q-empty">这边是空的。<br>去 Obsidian 里记一条灵感，或者直接跟我说你想写什么。</div>';

  host.querySelectorAll('.q-item').forEach(el => {
    el.addEventListener('click', () => select(el.dataset.kind, el.dataset.id));
  });
}

/* ---------- 选中 ---------- */
function findItem(kind, id){
  return ((STATE && STATE[kind]) || []).find(x => x.id === id);
}

function select(kind, id){
  if(kind === '数据'){ location.href = 'data.html'; return; }

  const item = findItem(kind, id);
  CUR = { kind, id, title:'', sub:'' };

  if(kind === '选题' && item){
    CUR.title = (item['标题候选'] || '').split('|')[0].trim() || id;
    const miss = item['缺冲突'] || [];
    CUR.sub = miss.length ? '缺：' + miss.join(' / ') : '冲突四格齐了';
  }else if(kind === '稿件' && item){
    CUR.title = item['选题标题'] || id;
    CUR.sub = (item['状态'] || '') + ' · ' + (item['字数'] || 0) + ' 字 · ' + (item['版本'] || 'v1');
  }else if(kind === '灵感' && item){
    CUR.title = item['原话'] || id;
    CUR.sub = (item['来源'] || '') + ' 记的 · ' + (item['捕获'] || '');
  }else{
    CUR.title = '没找到这条';
  }

  $('#chTitle').textContent = CUR.title;
  $('#chSub').textContent = CUR.sub || '';
  loadHistory();
  renderMsgs();
  renderQueue();
}

/* ---------- 消息 ---------- */
function msgHtml(m, idx){
  const ai = m.role !== 'user';
  return `<div class="msg ${ai ? 'ai' : 'user'}">
    <div class="who">${ai ? 'AI' : '你'}</div>
    <div class="bubble">${renderMd(m.content)}</div>
  </div>`;
}

function renderMsgs(){
  const host = $msgs();
  if(!CUR.kind){
    host.innerHTML = `<div class="blank" style="margin:auto">
      左边是这条线上<b>卡住的东西</b>。<br>
      点一条，我们就在这儿聊它。<br><br>
      也可以直接在这儿说：<b>我想写一篇关于……</b>
    </div>`;
    return;
  }
  host.innerHTML = HISTORY.map(msgHtml).join('');
  scrollBottom();
}

function scrollBottom(){
  const host = $msgs();
  host.scrollTop = host.scrollHeight;
}

/* ---------- 发送 ---------- */
async function send(){
  if(SENDING) return;
  const box = $('#input');
  const text = box.value.trim();
  if(!text) return;

  if(!CUR.kind){
    CUR = { kind:'', id:'', title:'与 AI 的对话', sub:'' };
    $('#chTitle').textContent = CUR.title;
    $('#chSub').textContent = '还没绑定到具体文件';
    loadHistory();
  }

  box.value = '';
  autoGrow(box);

  HISTORY.push({ role:'user', content: text });
  saveHistory();

  const host = $msgs();
  if(!host.querySelector('.msg')){
    host.innerHTML = '';
  }
  host.insertAdjacentHTML('beforeend', msgHtml({role:'user', content:text}));
  const aiWrap = document.createElement('div');
  aiWrap.className = 'msg ai';
  aiWrap.innerHTML = '<div class="who">AI</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
  host.appendChild(aiWrap);
  scrollBottom();

  SENDING = true;
  $('#send').disabled = true;

  const bubble = aiWrap.querySelector('.bubble');
  let painted = '';

  try{
    const payload = HISTORY.filter(m => !m._sys).map(m => ({role:m.role, content:m.content}));
    await chatStream(CUR.kind, CUR.id, payload, {
      onDelta(full){
        painted = full;
        bubble.innerHTML = renderMd(full);
        scrollBottom();
      },
      onDone(writes, full){
        const clean = (full || painted || '').trim();
        bubble.innerHTML = renderMd(clean) || '<span style="color:#B5B5B5">（这次没说话）</span>';
        HISTORY.push({ role:'assistant', content: clean });
        saveHistory();

        if(writes && writes.length){
          const bar = document.createElement('div');
          bar.className = 'writes';
          bar.innerHTML = `<div class="wt">AI 想改 <b>${writes.length}</b> 处：${
            writes.map(w => esc(w.kind + ' ' + w.id)).join('、')}</div>
            <button class="btn btn-sm btn-primary">应用</button>`;
          bar.querySelector('button').addEventListener('click', async (ev) => {
            ev.target.disabled = true;
            const r = await applyWrites(writes);
            ev.target.textContent = r.fail ? ('失败 ' + r.fail) : '已写入';
            toast(r.fail ? '有 ' + r.fail + ' 处没写进去' : '已写进文件');
            if(!r.fail){
              STATE = await getJSON('/api/state');
              renderSide(STATE, 'work');
              renderQueue();
            }
          });
          aiWrap.appendChild(bar);
        }
        scrollBottom();
      }
    });
  }catch(e){
    bubble.innerHTML = `<span style="color:#D9474C">${esc(e.message)}</span>`;
    HISTORY.push({ role:'assistant', content:'（出错了：' + e.message + '）' });
    saveHistory();
  }finally{
    SENDING = false;
    $('#send').disabled = false;
    box.focus();
  }
}

/* ---------- AI 未配置提示 ---------- */
function renderBanner(){
  const host = $('#aiBanner');
  if(!STATE) return;
  const ai = STATE['AI'] || {};
  if(ai['可用']){ host.innerHTML = ''; return; }
  host.innerHTML = `<div class="banner">
    <b>还没配模型，现在聊不了。</b><br>
    在项目根目录建一个 <code>本地配置.json</code>，写
    <code>{"api_key": "sk-..."}</code>；要换接口再加 <code>"接口"</code> 和 <code>"模型名"</code>。改完重启服务。<br>
    这个文件已经在 .gitignore 里，不会被提交。
  </div>`;
}

/* ---------- 启动 ---------- */
(async function init(){
  STATE = await boot('work');
  if(!STATE){
    offlineBlock($('#qList'));
    return;
  }
  renderBanner();
  renderQueue();
  renderMsgs();

  const box = $('#input');
  box.addEventListener('input', () => autoGrow(box));
  box.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  $('#send').addEventListener('click', send);

  const p = new URLSearchParams(location.search);
  const k = p.get('kind'), i = p.get('id');
  if(k && i && findItem(k, i)) select(k, i);
})();
</script>
</body>
</html>
